<template>
    <lightning-card title="Bulk Receipt Creation" icon-name="standard:partner_fund_claim">
        <div class="slds-p-around_medium">

            <!-- Loading -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- TABLE HEADER -->
            <div class="slds-grid slds-wrap slds-border_bottom slds-p-bottom_small 
                        slds-text-title_caps slds-text-color_weak table-header">

                <div class="slds-col slds-size_2-of-8 slds-p-horizontal_small opp-header">Opportunity</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">Amount</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">Payment Type</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">Reference</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">Charge Type</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">Payment Date</div>
                <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small slds-text-align_center">
                    Actions
                </div>
            </div>

            <!-- ROWS -->
            <template for:each={receiptList} for:item="rec">
                <lightning-record-edit-form 
                    key={rec.tempId}
                    object-api-name="AR_Receipt__c"
                    density="compact">

                    <div class="slds-grid slds-wrap slds-p-vertical_small 
                                slds-border_bottom slds-align-middle row-container
                                {rec.wrapperClass}" data-group-start={rec.isFirstInGroup}>

                        <!-- Opportunity (shown only for first row in group) -->
                        <div class="slds-col slds-size_2-of-8 slds-p-horizontal_small opp-col">
                            <template if:true={rec.isFirstInGroup}>
                                <p class="slds-text-body_regular slds-text-weight_bold 
                                          slds-truncate opp-name"
                                   title={rec.OppName}>
                                    {rec.OppName}
                                </p>
                            </template>
                        </div>

                        <!-- Amount -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">
                            <lightning-input 
                                type="number" 
                                formatter="currency"
                                step="0.01"
                                variant="label-hidden"
                                name="Amount__c"
                                data-id={rec.tempId}
                                value={rec.Amount__c}
                                onchange={changeHandler}
                                required>
                            </lightning-input>
                        </div>

                        <!-- Payment Type -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">
                            <lightning-input-field
                                field-name="Payment_Type__c"
                                variant="label-hidden"
                                data-id={rec.tempId}
                                onchange={changeHandler}
                                required>
                            </lightning-input-field>
                        </div>

                        <!-- Reference -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">
                            <lightning-input
                                type="text"
                                variant="label-hidden"
                                name="Payment_Reference__c"
                                data-id={rec.tempId}
                                value={rec.Payment_Reference__c}
                                onchange={changeHandler}
                                required>
                            </lightning-input>
                        </div>

                        <!-- Charge Type -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">
                            <lightning-input-field
                                field-name="Charge_Type__c"
                                variant="label-hidden"
                                data-id={rec.tempId}
                                onchange={changeHandler}
                                required>
                            </lightning-input-field>
                        </div>

                        <!-- Payment Date -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small">
                            <lightning-input
                                type="date"
                                name="Payment_Date__c"
                                variant="label-hidden"
                                data-id={rec.tempId}
                                value={rec.Payment_Date__c}
                                onchange={changeHandler}
                                required>
                            </lightning-input>
                        </div>

                        <!-- Actions -->
                        <div class="slds-col slds-size_1-of-8 slds-p-horizontal_small 
                                    action-buttons slds-text-align_center">

                            <lightning-button-icon 
                                icon-name="utility:add"
                                variant="border-filled"
                                alternative-text="Add Row"
                                title="Add Row Below"
                                data-id={rec.tempId}
                                onclick={addRowBelowHandler}>
                            </lightning-button-icon>

                            <lightning-button-icon 
                                icon-name="utility:delete"
                                variant="border-filled"
                                alternative-text="Remove"
                                title="Remove"
                                data-id={rec.tempId}
                                onclick={removeRowHandler}>
                            </lightning-button-icon>
                        </div>

                    </div>
                </lightning-record-edit-form>
            </template>

            <!-- Footer Buttons -->
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button label="Previous" variant="neutral" onclick={handleBack}></lightning-button>
                <div class="slds-p-horizontal_small"></div>
                <lightning-button variant="brand" label="Save Receipts" onclick={saveReceipts}></lightning-button>
                <div class="slds-p-horizontal_small"></div>
                <lightning-button label="Cancel" variant="neutral" onclick={Cancel}></lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
