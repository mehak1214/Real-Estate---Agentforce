<template>
    <div class="background-container" style={backgroundStyle}>
        <div class="centered-form">
            <template if:true={showLauncher}>
                <c-establishment-form
                    onregister={handleLauncherRegister}>
                </c-establishment-form>
            </template>
            
            <template if:true={showMainRegistration}>
                <!-- Add onexitregistration handler -->
                <c-broker-agency-registration
                    application-type={passedApplicationType}
                    reference-number={passedReferenceNumber}
                    onexitregistration={handleExitRegistration}>
                </c-broker-agency-registration>
            </template>
        </div>
    </div>
</template>
