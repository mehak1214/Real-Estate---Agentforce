<template>
    <div class="page-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="header-left">
                <h1 class="page-title">Sales Orders</h1>
                <p class="page-subtitle">Access all sales and commission details in one place</p>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <lightning-icon icon-name="utility:search" size="xx-small" class="search-icon"></lightning-icon>
                    <input type="text" class="search-input" placeholder="Search by Order ID, Project, Unit" value={searchTerm} oninput={handleSearch} />
                </div>
                <button class="refresh-button" onclick={handleRefresh} title="Refresh">
                    <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                </button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Summary Tiles -->
        <div class="summary-tiles">
            <div class="summary-tile">
                <div class="tile-icon"><lightning-icon icon-name="utility:metrics" size="medium"></lightning-icon></div>
                <div class="tile-number">{salesOrderCount}</div>
                <div class="tile-label">Total Orders</div>
            </div>
            <div class="summary-tile">
                <div class="tile-icon"><lightning-icon icon-name="utility:groups" size="medium"></lightning-icon></div>
                <div class="tile-number">{commissionCount}</div>
                <div class="tile-label">Broker Commissions</div>
            </div>
            <div class="summary-tile">
                <div class="tile-icon"><lightning-icon icon-name="utility:moneybag" size="medium"></lightning-icon></div>
                <div class="tile-number">{formattedCommissionTotal}</div>
                <div class="tile-label">Total Commission Amount</div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <div class="table-header-row">
                <div class="th th-id">ORDER ID</div>
                <div class="th th-project">PROJECT</div>
                <div class="th th-unit">UNIT</div>
                <div class="th th-amount">NET AMOUNT</div>
                <div class="th th-commission">COMMISSION</div>
                <div class="th th-status">STATUS</div>
                <div class="th th-action"></div>
            </div>

            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="loading-state">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Table Body -->
            <template if:false={isLoading}>
                <template if:true={hasOrders}>
                    <template for:each={filteredSalesOrders} for:item="order">
                        <div key={order.id} class="table-row-group">
                            <div class="table-row" onclick={toggleOrder} data-id={order.id}>
                                <div class="td td-id">{order.orderNumber}</div>
                                <div class="td td-project">{order.projectNameDisplay}</div>
                                <div class="td td-unit">{order.unitNameDisplay}</div>
                                <div class="td td-amount">{order.netAmountDisplay}</div>
                                <div class="td td-commission">
                                    <div class="comm-amount-main">{order.commissionTotalDisplay}</div>
                                    <div class="comm-linked">{order.commissionCount} linked</div>
                                </div>
                                <div class="td td-status">
                                    <span class="status-pill" data-tone={order.statusTone}>{order.statusLabel}</span>
                                </div>
                                <div class="td td-action">
                                    <lightning-icon icon-name="utility:down" size="xx-small" class={order.chevClass}></lightning-icon>
                                </div>
                            </div>
                            
                            <!-- Expanded Detail -->
                            <template if:true={order.isExpanded}>
                                <div class="expanded-area">
                                    <div class="expanded-grid">
                                        <!-- Left Side: Order Details -->
                                        <div class="order-details-section detail-tile">
                                            <h3 class="section-title">ORDER DETAILS</h3>
                                            <div class="details-list">
                                                <template for:each={order.detailFields} for:item="field">
                                                    <div class="detail-item" key={field.apiName}>
                                                        <span class="detail-label">{field.label}</span>
                                                        <span class="detail-value">{field.displayValue}</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>

                                        <!-- Right Side: Broker Commissions -->
                                        <div class="broker-commissions-section detail-tile">
                                            <h3 class="section-title">BROKER COMMISSIONS</h3>
                                            <template if:true={order.hasCommissions}>
                                                <template for:each={order.commissions} for:item="comm">
                                                    <div class="commission-card" key={comm.id}>
                                                        <div class="card-border" data-tone={comm.statusTone}></div>
                                                        <div class="card-content">
                                                            <div class="card-top">
                                                                <div class="broker-info">
                                                                    <div class="broker-name">{comm.brokerName}</div>
                                                                </div>
                                                                <div class="broker-amount-wrap">
                                                                    <div class="broker-amount">{comm.commissionAmountDisplay}</div>
                                                                    <span class="status-pill status-pill-small" data-tone={comm.statusTone}>{comm.statusLabel}</span>
                                                                </div>
                                                            </div>
                                                            <div class="card-bottom">
                                                                <template if:true={comm.unitName}>
                                                                    <div class="bottom-item">
                                                                        <span class="bottom-label">Unit</span>
                                                                        <span class="bottom-value">{comm.unitName}</span>
                                                                    </div>
                                                                </template>
                                                                <template for:each={comm.detailFields} for:item="f">
                                                                    <div class="bottom-item" key={f.apiName}>
                                                                        <span class="bottom-label">{f.label}</span>
                                                                        <span class="bottom-value">{f.displayValue}</span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                            <template if:false={order.hasCommissions}>
                                                <div class="no-commissions">No commissions linked.</div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
                
                <template if:false={hasOrders}>
                    <!-- Empty State -->
                    <div class="empty-state-container">
                        <div class="empty-circle-icon">
                            <lightning-icon icon-name="utility:pie_chart" size="large"></lightning-icon>
                        </div>
                        <h2 class="empty-heading">No sales added yet.</h2>
                        <p class="empty-subtext">Once added it will appear here</p>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
