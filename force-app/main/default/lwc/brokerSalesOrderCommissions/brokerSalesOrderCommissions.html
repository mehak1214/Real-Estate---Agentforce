<template>
    <div class="app-container">
        <!-- Header -->
        <div class="page-header">
            <div class="header-titles">
                <h1 class="page-title">Sales Orders</h1>
                <p class="page-subtitle">Every order with its broker commission entries, in one ledger.</p>
            </div>
            <button class="btn-refresh" onclick={handleRefresh} title="Refresh" disabled={isLoading}>
                <lightning-icon icon-name="utility:refresh" size="xx-small" variant="inverse"
                    class={refreshIconClass}></lightning-icon>
                <span>Refresh</span>
            </button>
        </div>

        <template if:true={hasError}>
            <div class="error-banner">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <!-- Summary Tiles -->
        <div class="kpi-row">
            <div class="kpi-card kpi-blue">
                <div class="kpi-content">
                    <div class="kpi-label">SALES ORDERS</div>
                    <template if:true={isLoading}>
                        <div class="skeleton skeleton-kpi"></div>
                    </template>
                    <template if:false={isLoading}>
                        <div class="kpi-value">{salesOrderCount}</div>
                        <div class="kpi-subtext">{filteredCount} shown with current filters</div>
                    </template>
                </div>
                <div class="kpi-icon-wrap"><lightning-icon icon-name="utility:product" size="small"></lightning-icon>
                </div>
            </div>
            <div class="kpi-card kpi-indigo">
                <div class="kpi-content">
                    <div class="kpi-label">BROKER COMMISSION ENTRIES</div>
                    <template if:true={isLoading}>
                        <div class="skeleton skeleton-kpi"></div>
                    </template>
                    <template if:false={isLoading}>
                        <div class="kpi-value">{commissionCount}</div>
                        <div class="kpi-subtext">Child commission records across all orders</div>
                    </template>
                </div>
                <div class="kpi-icon-wrap"><lightning-icon icon-name="utility:snippet" size="small"></lightning-icon>
                </div>
            </div>
            <div class="kpi-card kpi-green">
                <div class="kpi-content">
                    <div class="kpi-label">TOTAL COMMISSION</div>
                    <template if:true={isLoading}>
                        <div class="skeleton skeleton-kpi"></div>
                    </template>
                    <template if:false={isLoading}>
                        <div class="kpi-value">{formattedCommissionTotal}</div>
                        <template if:true={hasVat}>
                            <div class="kpi-subtext">Incl. VAT: {formattedCommissionWithVat}</div>
                        </template>
                        <template if:false={hasVat}>
                            <div class="kpi-subtext">Across {commissionCount} commission records</div>
                        </template>
                    </template>
                </div>
                <div class="kpi-icon-wrap"><lightning-icon icon-name="utility:currency" size="small"></lightning-icon>
                </div>
            </div>
        </div>

        <!-- Search & Filters -->
        <div class="toolbar">
            <div class="search-box">
                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                <input class="search-input" type="text" placeholder="Search order, customer, or broker..."
                    value={searchTerm} onkeyup={handleSearch} />
                <template if:true={searchTerm}>
                    <button class="btn-clear" title="Clear search" onclick={handleClearSearch}>
                        <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                    </button>
                </template>
            </div>
            <div class="btn-filter">
                <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
                <select class="status-select" onchange={handleStatusFilterChange}>
                    <template for:each={statusOptions} for:item="opt">
                        <option key={opt.value} value={opt.value} selected={opt.isSelected}>{opt.label}</option>
                    </template>
                </select>
            </div>
        </div>

        <!-- Data Table -->
        <div class="data-table">
            <div class="table-header">
                <div class="th-col th-chevron"></div>
                <div class="th-col">ORDER #</div>
                <div class="th-col">PROJECT</div>
                <div class="th-col">UNIT</div>
                <div class="th-col">STATUS</div>
                <div class="th-col">ORDER VALUE</div>
                <div class="th-col">COMMISSION TOTAL</div>
                <div class="th-col">INVOICE</div>
            </div>

            <template if:true={isLoading}>
                <template for:each={skeletonRows} for:item="row">
                    <div class="skeleton-row" key={row.key}>
                        <div class="skeleton skeleton-chevron"></div>
                        <div class="skeleton skeleton-cell"></div>
                        <div class="skeleton skeleton-cell"></div>
                        <div class="skeleton skeleton-cell"></div>
                        <div class="skeleton skeleton-pill"></div>
                        <div class="skeleton skeleton-cell"></div>
                        <div class="skeleton skeleton-cell"></div>
                        <div class="skeleton skeleton-cell"></div>
                    </div>
                </template>
            </template>
            <template if:false={isLoading}>
                <template for:each={filteredSalesOrders} for:item="order">
                    <div class={order.rowClass} key={order.id}>
                        <!-- Parent Row -->
                        <div class="parent-row" data-id={order.id} onclick={toggleOrder}>
                            <div class="td-col td-chevron">
                                <lightning-icon icon-name="utility:chevronright" size="x-small"
                                    class={order.chevClass}></lightning-icon>
                            </div>
                            <div class="td-col fw-bold text-dark">{order.orderNumber}</div>
                            <div class="td-col fw-semibold text-dark">{order.projectNameDisplay}</div>
                            <div class="td-col text-gray">{order.unitNameDisplay}</div>
                            <div class="td-col">
                                <span class="pill" data-tone={order.statusTone}>{order.statusLabel}</span>
                            </div>
                            <div class="td-col fw-bold text-dark">{order.netAmountDisplay}</div>
                            <div class="td-col commission-total-col">
                                <span class="comm-amount-text">{order.commissionTotalDisplay}</span>
                                <span class="comm-count-badge">{order.commissionCount}</span>
                            </div>
                            <div class="td-col invoice-col" onclick={stopPropagation}>
                                <template if:true={order.invoiceLoading}>
                                    <div class="invoice-spinner">
                                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                    </div>
                                </template>
                                <template if:false={order.invoiceLoading}>
                                    <template if:true={order.hasInvoice}>
                                        <button class="btn-invoice btn-invoice-view" data-id={order.id}
                                            onclick={handleDownloadInvoice} title="Download Invoice">
                                            <lightning-icon icon-name="utility:download"
                                                size="xx-small"></lightning-icon>
                                            <span>Download Invoice</span>
                                        </button>
                                    </template>
                                    <template if:false={order.hasInvoice}>
                                        <div class="invoice-actions">
                                            <button class="btn-invoice btn-invoice-create" data-id={order.id}
                                                onclick={handleCreateInvoice} title="Generate Invoice PDF">
                                                <lightning-icon icon-name="utility:new"
                                                    size="xx-small"></lightning-icon>
                                                <span>Create</span>
                                            </button>
                                            <button class="btn-invoice btn-invoice-upload" data-id={order.id}
                                                onclick={handleUploadClick} title="Upload Invoice">
                                                <lightning-icon icon-name="utility:upload"
                                                    size="xx-small"></lightning-icon>
                                                <span>Upload</span>
                                            </button>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>

                        <!-- Child Rows (Expanded) -->
                        <template if:true={order.isExpanded}>
                            <div class="child-area">
                                <div class="child-section-title">
                                    <lightning-icon icon-name="utility:people" size="xx-small"></lightning-icon>
                                    <span>Broker Commissions ({order.commissionCount})</span>
                                </div>
                                <template if:true={order.hasCommissions}>
                                    <div class="child-bordered-table">
                                        <table class="commission-table">
                                            <thead>
                                                <tr>
                                                    <th>Broker</th>
                                                    <th>Unit</th>
                                                    <template for:each={order.commissionHeaders} for:item="h">
                                                        <th key={h.id}>{h.label}</th>
                                                    </template>
                                                    <th>Commission</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={order.commissions} for:item="comm">
                                                    <tr key={comm.id}>
                                                        <td class="fw-semibold text-dark">{comm.brokerName}</td>
                                                        <td class="text-gray">{comm.unitName}</td>
                                                        <template for:each={comm.detailFields} for:item="f">
                                                            <td key={f.apiName} class="text-gray">{f.displayValue}</td>
                                                        </template>
                                                        <td class="fw-bold text-teal">{comm.commissionAmountDisplay}
                                                        </td>
                                                        <td>
                                                            <span class="pill"
                                                                data-tone={comm.statusTone}>{comm.statusLabel}</span>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template if:false={order.hasCommissions}>
                                    <div class="no-commissions-msg">
                                        <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                                        <span>No broker commission entries found for this order.</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={hasOrders}>
                    <div class="empty-state-container" style="padding: 64px; text-align: center;">
                        <div class="empty-heading text-dark fw-bold">No orders found</div>
                        <div class="empty-subtext text-gray">Adjust your search to find what you're looking for.</div>
                    </div>
                </template>
            </template>
        </div>
    </div>

    <!-- Hidden file input for invoice upload -->
    <input type="file" class="invoice-file-input" accept=".pdf,.png,.jpg,.jpeg" onchange={handleFileSelected}
        style="display:none;" />
</template>
