<template>
    <lightning-card class="projects-list-main">
            <div class="slds-grid slds-grid_vertical-stretch">
                <div class="slds-col slds-size_12-of-12">
                    <div class="slds-box slds-box_x-small ProjectList">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <div>
                                <lightning-icon class="Allicon" icon-name='standard:multi_picklist' ></lightning-icon>  
                            </div>
                            <div class="slds-p-left_x-small">
                                <span class="top-header-text">Project List</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>           
            <!--The below-->
            
            <div class="slds-grid slds-grid_vertical-stretch ">
                <div class="slds-col slds-size_3-of-12">

                    <div class="slds-box  filterList ">
                        <div style="border-bottom: 1px solid #BDCDD6;">
                            <span style="font-weight:bold;padding-bottom: 10px;"><b>Filter By</b></span>
                        </div>
                        <lightning-combobox
                            name="location"
                            label="Location"
                            value={selectedLocation}
                            placeholder="All"
                            options={locationOptions}
                            onchange={handleLocationChange}></lightning-combobox>
                        <lightning-combobox
                            name="project Type"
                            label="Project Type"
                            value={selectedType}
                            placeholder="All"
                            options={typeOptions}
                            onchange={handleTypeChange}></lightning-combobox>
                        <lightning-combobox
                            name="status"
                            label="Project Status"
                            value={selectedStatus}
                            placeholder="All"
                            options={statusOptions}
                            onchange={handleStatusChange}></lightning-combobox>
                    </div>

                </div>

                <div class="slds-col slds-size_9-of-12 projects-list-box">
                    <div class="slds-text-body_regular">
                        <div class="slds-text-heading_medium" style="margin-left:1em"><b> Projects : {CountOfProjects}</b>
                        </div>
                        <br/><br/>
                    </div>
                       
                    <div class="grid-container">
                        <template if:true={projectFilteredList}>
                                <template for:each={projectFilteredList} for:item="proj"> 
                                    
                                    <div class="grid-item" key={proj.id}>
                                                    <div class="image-container">

                                                        <img src={imageUrl} alt="Building Image" width="100" height="100"></div>
                                                        <div class="project-details">
            
                                                            <div class="slds-text-heading_small text-bold">{proj.Name}</div><!---->
                                                            <div class="slds-text-heading_small"><a href="#"><i>{proj.Project_Address__City__s} </i></a></div>
                                                            
                                                            <p style="margin:5px">Towers : {proj.Total_Towers__c}</p>
                                                            <p style="margin:5px">Total Units : {proj.Total_Units__c}</p>
            
                                                            <lightning-button
                                                                variant="Brand"
                                                                label="View Details"
                                                                size="small"
                                                                data-record-id={proj.Id}
                                                                onclick={navigateToProject}></lightning-button>
                                                        </div>
                                        </div>
                                    </template>
                        </template>
                    </div>        
                </div>
    </div>
</lightning-card>
</template>
