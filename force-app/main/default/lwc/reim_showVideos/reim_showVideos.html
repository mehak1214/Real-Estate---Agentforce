<template>
    <div class="slds-text-heading_large">Watch Video</div>

    <div class="slds-grid slds-grid_vertical-stretch riem-vid-gal">
        <div class="slds-col slds-size_12-of-12">
            <div class="grid-container">
                <template for:each={mapData} for:item="item">
                    <div key={item.value} class="grid-item"> 
                        <strong>FileName - </strong>{item.value}
                            <video width="100%" height="auto" controls="controls">
                                <source src={item.key} type="video/mp4" />
                            </video>
                    </div>
                </template>
            </div>
        </div>
    </div>
